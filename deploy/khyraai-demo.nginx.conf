# ==============================================================================
# khyraai-demo.nginx.conf — Nginx vhost for khyraai.demo
# ------------------------------------------------------------------------------
# This file proxies HTTPS + WSS traffic from khyraai.demo to the local
# FastAPI server on port 8085.
#
# Place at:  /etc/nginx/sites-available/khyraai-demo
# Enable:    sudo ln -s /etc/nginx/sites-available/khyraai-demo \
#                       /etc/nginx/sites-enabled/khyraai-demo
# Test:      sudo nginx -t
# Reload:    sudo systemctl reload nginx
# ==============================================================================

# --- HTTP → HTTPS redirect (also handles ACME .well-known challenges) ---------
server {
    listen 80;
    listen [::]:80;
    server_name demo.khyraai.com;

    # Let's Encrypt HTTP-01 challenge — certbot writes tokens here
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS main vhost ----------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name demo.khyraai.com;

    # ---- TLS (filled in by certbot) ------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/demo.khyraai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.khyraai.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ---- Security headers -----------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    # ---- CORS — allow your website origin(s) ----------------------------------
    # Adjust if your website is on a specific domain; * is fine for the demo.
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;

    # ---- WebSocket /ws endpoint -----------------------------------------------
    # wss://khyraai.demo/ws  →  ws://127.0.0.1:8085/ws
    location /ws {
        proxy_pass         http://127.0.0.1:8085/ws;
        proxy_http_version 1.1;

        # Required for WebSocket upgrade
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        # Long timeout — a voice demo session can last many minutes
        proxy_read_timeout    1800s;
        proxy_send_timeout    1800s;
        proxy_connect_timeout 10s;

        # Disable buffering for real-time audio streaming
        proxy_buffering    off;
        proxy_cache        off;
    }

    # ---- REST API + static files ----------------------------------------------
    location / {
        proxy_pass         http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_read_timeout 60s;
    }
}
